[project]
name = "chuva-bh"
version = "0.1.0"
description = "Rain nowcasting for Belo Horizonte: MLOps platform and GenAI agent on AWS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-cdk-lib==2.275.0",
    "boto3==1.43.127",
    "botocore[crt]==1.43.127",
    "constructs==10.8.1",
    "pandas==3.1.0",
    "pyarrow==24.0.0",
    "pydantic==2.14.3",
]

[dependency-groups]
agent = [
    "bedrock-agentcore==1.25.4",
    "langchain-aws==1.9.2",
    "langgraph==1.2.20",
]
dev = [
    "moto[cloudformation,cloudtrail,dynamodb,iam,resourcegroupstaggingapi,s3,sagemaker,ssm,sts]==5.2.5",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "types-boto3[bedrock-agent-runtime,ce,cloudformation,cloudtrail,cloudwatch,dynamodb,iam,resourcegroupstaggingapi,s3,sagemaker,sagemaker-runtime,ssm,sts]==1.43.127",
]
ml = [
    "sagemaker==2.257.7",
    "xgboost==3.4.1",
]

[tool.uv]
package = false
default-groups = ["dev", "ml", "agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["infra", "scripts", "src", "tests"]
mypy_path = ["infra", "scripts", "src"]
explicit_package_bases = true
namespace_packages = true
exclude = ["cdk\\.out"]

[[tool.mypy.overrides]]
module = ["moto", "moto.*", "pandas", "pandas.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Script que só orquestra o Model Monitor, cuja API no SDK não tem anotações de tipo.
[[tool.mypy.overrides]]
module = ["model_monitor_exercise"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["infra", "scripts", "src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not aws",
    "--cov=infra",
    "--cov=scripts",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = ["aws: integration test that calls a real AWS account"]
